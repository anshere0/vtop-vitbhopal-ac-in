<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTOP - Login</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <span class="vit-logo">VIT</span> <span class="campus">(Bhopal Campus)</span>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">VTOP Login</div>
            <div id="error-msg" class="error-message">Invalid Username or Password</div>
            
            <form id="login-form" class="login-form">
                <div class="form-group input-group">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="#007bff" width="16" height="16"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </span>
                </div>
                
                <div class="form-group input-group">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <span class="input-icon" id="toggle-pwd">
                        <svg viewBox="0 0 24 24" fill="#d9534f" width="16" height="16"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </span>
                </div>

                <div class="form-group captcha-group">
                    <canvas id="captcha-canvas" width="220" height="45"></canvas>
                    <button type="button" class="refresh-btn" id="refresh-captcha">
                        <svg viewBox="0 0 24 24" fill="white" width="16" height="16"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                </div>
                
                <div class="form-group">
                    <input type="text" id="captcha" class="captcha-input" name="captcha" placeholder="Enter CAPTCHA shown above" required>
                </div>

                <div class="submit-row">
                    <button type="submit" class="login-btn">Submit</button>
                </div>
            </form>

            <div class="login-footer">
                <div class="left-links">
                    <a href="#">Forgot Password</a>
                    <a href="#">Forgot LoginId</a>
                </div>
                <div class="right-link">
                    <a href="#">Go to Home Page</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        Copyright &copy; 2026 Software Development Cell, VIT, Bhopal-466 114.
    </footer>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ui.js"></script>
</body>
</html>
